[workspace]
resolver = "2"
members = [
    "crates/opencode-schema",
    "crates/opencode-llm",
    "crates/opencode-core",
    "crates/opencode-server",
    "crates/opencode-tui",
    "crates/opencode",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/moshemalawach/opencode-rs"

[workspace.dependencies]
# Async runtime & HTTP
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "compression-gzip"] }
eventsource-stream = "0.2"
tokio-tungstenite = "0.26"
portable-pty = "0.9"
futures = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_json_path = "0.7"
jsonc-parser = "0.33"
fs4 = "0.13"
tree-sitter = "0.25"
tree-sitter-bash = "0.23"
similar = "2"
grep-regex = "0.1"
grep-searcher = "0.1"
base64 = "0.22"
flate2 = "1"
tokio-util = "0.7"
rust_decimal = "1"

# Database
rusqlite = { version = "0.32", features = ["bundled"] }

# CLI & errors
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "2"
libc = "0.2"

# IDs & utilities
ulid = { version = "1", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
notify = "8"
globset = "0.4"
ignore = "0.4"
gray_matter = "0.1"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
smallvec = "1"
indexmap = { version = "2", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"
walkdir = "2"
dirs = "6"
rand = "0.8"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Internal
opencode-schema = { path = "crates/opencode-schema" }
opencode-llm = { path = "crates/opencode-llm" }
opencode-core = { path = "crates/opencode-core" }
opencode-server = { path = "crates/opencode-server" }
opencode-tui = { path = "crates/opencode-tui" }

[profile.dev]
debug = 1

[profile.dev.package."*"]
debug = 0
