[package]
name = "alforria-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
alforria-schema = { workspace = true }
alforria-llm = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
rusqlite = { workspace = true }
anyhow = { workspace = true }
libc = { workspace = true }
thiserror = { workspace = true }
jsonc-parser = { workspace = true }
fs4 = { workspace = true }
walkdir = { workspace = true }
sha2 = { workspace = true }
sha1 = { workspace = true }
hex = { workspace = true }
dirs = { workspace = true }
indexmap = { workspace = true }
rand = { workspace = true }
tree-sitter = { workspace = true }
tree-sitter-bash = { workspace = true }
similar = { workspace = true }
grep-regex = { workspace = true }
grep-searcher = { workspace = true }
base64 = { workspace = true }
tokio-util = { workspace = true }
reqwest = { workspace = true }
notify = { workspace = true }
globset = { workspace = true }
ignore = { workspace = true }
gray_matter = { workspace = true }
chrono = { workspace = true }
ulid = { workspace = true }
regex = { workspace = true }
rust_decimal = { workspace = true }
tracing = { workspace = true }
rquickjs = { workspace = true }
croner = "4.0.3"
chrono-tz = "0.10.4"

[dev-dependencies]
# `start_paused` for the M5.8 retry tests (deterministic clocks, no sleeps)
tokio = { workspace = true, features = ["test-util"] }
tempfile = "3"

[features]
# Test instrumentation only: `protect::fail_point`, a hook between the write
# guard's judgement of a path and the write. Enabled by the test builds of
# the crates that need it; never by a release build.
fail-points = []
