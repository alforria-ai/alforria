name: windows-debug

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: Swatinem/rust-cache@v2

      - name: Install nextest
        run: cargo install cargo-nextest --locked || true

      - name: Hunt the hanging tui test
        run: cargo nextest run --retries 1 --no-fail-fast -E 'not (package(alforria-core) or binary(pty) or test(pty::tests))'
