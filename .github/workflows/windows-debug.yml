name: windows-debug

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: Swatinem/rust-cache@v2

      - name: Run the hanging e2e test
        run: cargo test --verbose -p alforria --test e2e run_default_format_prints_text_to_stdout -- --nocapture --test-threads=1

      - name: Env facts
        if: always()
        shell: bash
        run: |
          env | grep -iE "proxy|no_proxy" || echo "no proxy env"
          netsh winhttp show proxy || true
          echo "--- probes ---"
          powershell -Command "Test-NetConnection -ComputerName 127.0.0.1 -Port 80" || true
