name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  parity:
    runs-on: ubuntu-latest
    env:
      OPENCODE_PARITY: '1'
      OPENCODE_TS_SRC: ${{ github.workspace }}/.reference/opencode
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: anomalyco/opencode
          ref: 88c6c7abc7f320b6aabed2634ac0b2d6e6ecea67
          path: .reference/opencode
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
        working-directory: .reference/opencode
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Compare live API, schema and event inventories
        run: cargo test -p alforria --test parity p0_ -- --ignored
      - name: Compare structured output against both runtimes
        run: cargo test -p alforria --test parity p8_ -- --ignored
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parity-reports
          path: target/parity
          if-no-files-found: ignore

  portability:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recovery, authorization and storage regressions
        run: |
          cargo test -p alforria-core session::snapshot::git_tests --lib
          cargo test -p alforria-core move_authorizes_both_endpoints --lib
          cargo test -p alforria-core storage::connection::tests --lib
          cargo test -p alforria-core active_context_stops --lib
      - name: Real PTY lifecycle and websocket tests
        run: |
          cargo test -p alforria-server --lib pty::tests
          cargo test -p alforria-server --test pty

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build
      - run: bun run verify:bundle

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Build
        run: cargo build
      - name: Install nextest
        run: cargo install cargo-nextest --locked || true
      - name: Test
        run: cargo nextest run || cargo test --all
      - name: Offline structured-output parity
        env:
          OPENCODE_PARITY: '1'
          OPENCODE_PARITY_GOLDEN: '1'
        run: cargo test -p alforria --test parity p8_ -- --ignored
