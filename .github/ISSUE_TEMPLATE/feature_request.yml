name: Feature request
description: Suggest a capability or an improvement
title: 'feat: '
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Please describe the problem first, then the
        shape of the change you have in mind. Check existing issues before
        opening a new one.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what blocks you today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the behavior or interface you want. Include examples if useful.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds or other designs you have considered.
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options:
        - Terminal UI
        - CLI
        - Local server / API
        - Web client
        - Providers and models
        - Configuration
        - Documentation
        - Build, packaging, or release
        - Other
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Links, screenshots, references to other tools, or upstream fixtures.
